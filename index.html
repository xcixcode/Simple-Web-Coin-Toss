<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fdfaf1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1d1b17" media="(prefers-color-scheme: dark)">
    <!-- Google Search Console -->
    <meta name="google-site-verification" content="Q5nfMziST5tgsHaAJ7CjpcWxddsXkPrGG76G9H2fJ8g" />
    <meta name="googlebot" content="noindex" />
    <meta name="description" content="버튼을 누르는 시간으로 파워를 정해 던지는 인터랙티브 3D 동전 던지기">
    <title>Simple-Web-Coin-Toss</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg-color: #fdfaf1;
            --text: #5d5b54;
            --muted: #7a776d;
            --track: #e0e0e0;
            --coin-size: clamp(140px, 38vmin, 200px); /* [개선] 미디어쿼리 대신 유동 크기 */
            --gray-blur: rgba(100, 100, 100, 0.6);
            --arcade-red: #d63a2b;   /* [개선] 흰 글자와의 명암비 향상 */
            --arcade-dark: #962d22;
            --focus: #2b6cb0;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg-color: #1d1b17; --text: #e9e4d6; --muted: #a9a595; --track: #3a372f; --focus: #7fb3f0; }
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; background-color: var(--bg-color); }
        body {
            height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            /* [개선] 로드되지 않는 'Pretendard' 단독 지정 → 시스템 폰트 폴백 스택 */
            font-family: 'Pretendard', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            color: var(--text); touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        /* [신규] 상단 바: 기록 + 소리 + 초기화 */
        .topbar {
            width: 100%; padding: max(12px, env(safe-area-inset-top)) 16px 0;
            display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .95rem;
        }
        .tally { margin: 0; display: flex; gap: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .dot { display: inline-block; width: .8em; height: .8em; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
        .dot.h { background: #f1c40f; } .dot.t { background: #95a5a6; }
        .chip {
            font: inherit; font-size: 1.15rem; line-height: 1; color: var(--muted); background: transparent; cursor: pointer;
            border: 1px solid var(--track); border-radius: 999px; padding: 8px 12px; min-width: 44px; min-height: 44px;
        }
        .chip:hover { color: var(--text); }

        /* 3D 무대: 카메라가 동전을 살짝 위에서 내려다봄 */
        #viewport { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; perspective: 1100px; perspective-origin: 50% 35%; transform-style: preserve-3d; }
        #coin { --t: calc(var(--coin-size) * .09); width: var(--coin-size); height: var(--coin-size); position: relative; transform-style: preserve-3d; will-change: transform; }
        #coin.blurring .side { filter: blur(25px); background: var(--gray-blur) !important; border: none; }

        /* [신규] 동전 두께: 얇은 원판 16장을 쌓고 리브(톱니) 무늬를 입힘. 앞면 쪽 절반은 금색, 뒷면 쪽은 은색 */
        .rim { position: absolute; inset: 0; border-radius: 50%; transform: translateZ(calc((var(--i) / 15 - .5) * var(--t))); }
        .rim.gold { background: repeating-conic-gradient(rgba(0,0,0,.28) 0 2deg, transparent 2deg 4deg), #c9a30d; }
        .rim.silver { background: repeating-conic-gradient(rgba(0,0,0,.28) 0 2deg, transparent 2deg 4deg), #8e969a; }

        .side {
            width: 100%; height: 100%; border-radius: 50%; position: absolute; backface-visibility: hidden;
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.15), 0 10px 25px rgba(0,0,0,0.12);
            border: 6px solid rgba(255,255,255,0.45);
        }
        .side::after { content: ""; position: absolute; inset: 10%; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); }
        /* [신규] 회전각에 따라 흐르는 금속 반사광 (--sx는 JS가 갱신) */
        .side::before { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
            background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); background-size: 300% 100%; background-position: var(--sx, 50%) 0; opacity: var(--lit, .6); }
        .heads { background: linear-gradient(135deg, #f1c40f, #d4ac0d); transform: translateZ(calc(var(--t) / 2)); }
        /* 가로축(X) 회전으로 뒤집히므로 뒷면도 rotateX(180deg)로 배치해야 결과가 똑바로 보임 */
        .tails { background: linear-gradient(135deg, #bdc3c7, #95a5a6); transform: rotateX(180deg) translateZ(calc(var(--t) / 2)); }
        /* [개선] 도안(SVG)은 그대로, 양각(돋을새김) 효과만 추가 */
        .side svg { width: 55%; height: 55%; fill: white; }
        #shadow {
            position: absolute; left: 50%; top: calc(50% + var(--coin-size) * .42); translate: -50% 0 -40px;
            width: calc(var(--coin-size) * .95); height: calc(var(--coin-size) * .26);
            background: rgba(0,0,0,0.28); border-radius: 50%; filter: blur(10px); will-change: transform, opacity;
        }

        .ui { width: 100%; padding-bottom: max(40px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; z-index: 100; }
        #resultText { font-size: 1.5rem; font-weight: 800; margin: 0 0 20px; min-height: 1.6em; opacity: 0; transition: opacity .4s; }
        .gauge-container { width: 180px; height: 14px; background: var(--track); border-radius: 20px; margin-bottom: 20px; overflow: hidden; opacity: 0; transition: opacity .2s; border: 3px solid var(--bg-color); }
        #gauge { width: 0%; height: 100%; background: linear-gradient(90deg, #3498db 0%, #e74c3c 100%); }
        .hint { margin: 22px 16px 0; font-size: .85rem; color: var(--muted); text-align: center; }

        .arcade-button {
            position: relative; width: 180px; height: 70px; background: var(--arcade-dark); border-radius: 40px;
            cursor: pointer; border: none; padding: 0; box-shadow: 0 15px 25px rgba(0,0,0,0.2);
            transition: transform 0.1s ease; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        }
        .arcade-button-top {
            position: absolute; top: -10px; left: 0; width: 100%; height: 100%; background: var(--arcade-red); border-radius: 40px;
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.3rem; font-weight: 900;
            box-shadow: inset 0 4px 0 rgba(255,255,255,0.3), 0 8px 0 var(--arcade-dark); transition: all 0.05s ease;
        }
        .arcade-button.pressed { transform: translateY(4px); }
        .arcade-button.pressed .arcade-button-top { top: -4px; box-shadow: inset 0 2px 0 rgba(255,255,255,0.1), 0 4px 0 var(--arcade-dark); }
        /* [개선] outline:none 제거 → 키보드 포커스 표시 복원 */
        .arcade-button:focus-visible, .chip:focus-visible { outline: 3px solid var(--focus); outline-offset: 6px; }
        .chip:focus-visible { outline-offset: 2px; }
        .arcade-button[aria-disabled="true"] { filter: grayscale(0.8); cursor: not-allowed; opacity: 0.6; }

        @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <!-- [개선] 시맨틱 구조: header / main / 상태 영역 -->
    <header class="topbar">
        <p class="tally" aria-label="던진 기록">
            <span><i class="dot h" aria-hidden="true"></i>태양 <span id="cntHeads">0</span></span>
            <span><i class="dot t" aria-hidden="true"></i>초승달 <span id="cntTails">0</span></span>
        </p>
        <div>
            <button type="button" class="chip" id="muteBtn" aria-label="소리 켜짐" title="소리 켜짐">🔊</button>
            <button type="button" class="chip" id="resetBtn" aria-label="기록 초기화" title="기록 초기화">🗑️</button>
        </div>
    </header>

    <main style="display:contents">
        <h1 class="sr-only">Simple-Web-Coin-Toss</h1>
        <div id="viewport" aria-hidden="true">
            <div id="coin">
                <div class="side heads"><svg viewBox="0 0 24 24"><path d="M12,7c-2.76,0-5,2.24-5,5s2.24,5,5,5s5-2.24,5-5S14.76,7,12,7L12,7z M2,13l2,0c0.55,0,1-0.45,1-1s-0.45-1-1-1l-2,0 c-0.55,0-1,0.45-1,1S1.45,13,2,13z M20,13l2,0c0.55,0,1-0.45,1-1s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S19.45,13,20,13z M11,2v2 c0,0.55,0.45,1,1,1s1-0.45,1-1V2c0-0.55-0.45-1-1-1S11,1.45,11,2z M11,20v2c0,0.55,0.45,1,1,1s1-0.45,1-1v-2c0-0.55-0.45-1-1-1 S11,19.45,11,20z M5.99,4.58c-0.39-0.39-1.03-0.39-1.41,0c-0.39,0.39-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0 s0.39-1.03,0-1.41L5.99,4.58z M18.36,16.95c-0.39-0.39-1.03-0.39-1.41,0c-0.39,0.39-0.39,1.03,0,1.41l1.06,1.06 c0.39,0.39,1.03,0.39,1.41,0c0.39-0.39,0.39-1.03,0-1.41L18.36,16.95z M19.42,5.99c0.39-0.39,0.39-1.03,0-1.41 c-0.39-0.39-1.03-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41s1.03,0.39,1.41,0L19.42,5.99z M7.05,18.36 c0.39-0.39,0.39-1.03,0-1.41c-0.39-0.39-1.03-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41s1.03,0.39,1.41,0L7.05,18.36z"/></svg></div>
                <div class="side tails"><svg viewBox="0 0 24 24"><path d="M12.12,2.05C9.34,2.1,6.81,3.48,5.2,5.71c-0.3,0.42-0.08,1,0.44,1.1c2.14,0.4,3.75,2.27,3.75,4.49s-1.61,4.09-3.75,4.49 c-0.52,0.1-0.74,0.68-0.44,1.1c1.61,2.23,4.14,3.61,6.92,3.66c4.68,0.08,8.54-3.7,8.72-8.38C20.99,6.29,17,2.2,12.12,2.05z"/></svg></div>
            </div>
            <div id="shadow"></div>
        </div>

        <div class="ui">
            <!-- [개선] 결과를 스크린리더에 알림 (reveal 시점에만 텍스트 삽입) -->
            <p id="resultText" role="status" aria-live="polite"></p>
            <div class="gauge-container" id="gCont" role="progressbar" aria-label="던지기 파워" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="gauge"></div></div>
            <button type="button" class="arcade-button" id="tossBtn" aria-describedby="hint">
                <span class="arcade-button-top">동전 던지기</span>
            </button>
            <p class="hint" id="hint">길게 눌러 파워를 모으고, 놓으면 던집니다. (키보드: Space / Enter)</p>
        </div>
    </main>

    <script>
        'use strict';
        const $ = (id) => document.getElementById(id);
        const btn = $('tossBtn'), gauge = $('gauge'), gCont = $('gCont'), coin = $('coin'), shadow = $('shadow'), result = $('resultText');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
        const POWER_PER_MS = 3.8 / 16;   // 기존 setInterval(16ms)·3.8 속도를 프레임 독립적으로 환산

        let ctx = null, muted = false, stats = { heads: 0, tails: 0 };
        let tossing = false, raf = 0, last = 0, power = 0, direction = 1, current = null;

        // [신규] 기록·소리 설정 저장 (저장소 사용 불가 환경 대비 try/catch)
        try {
            stats = Object.assign(stats, JSON.parse(localStorage.getItem('coin-stats')));
            muted = localStorage.getItem('coin-muted') === '1';
        } catch (e) {}
        const save = () => { try { localStorage.setItem('coin-stats', JSON.stringify(stats)); localStorage.setItem('coin-muted', muted ? '1' : '0'); } catch (e) {} };
        function render() {
            $('cntHeads').textContent = stats.heads; $('cntTails').textContent = stats.tails;
            const m = $('muteBtn'), label = muted ? '소리 꺼짐' : '소리 켜짐';   // 이모지 버튼: 접근성 라벨은 유지
            m.textContent = muted ? '🔇' : '🔊'; m.setAttribute('aria-label', label); m.title = label;
        }
        $('muteBtn').addEventListener('click', () => { muted = !muted; save(); render(); });
        $('resetBtn').addEventListener('click', () => { stats = { heads: 0, tails: 0 }; save(); render(); });
        render();

        // [개선] AudioContext를 첫 사용자 입력 시점에 생성 (자동재생 정책 경고 방지)
        function getCtx() {
            if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ctx = new AC(); }
            if (ctx && ctx.state === 'suspended') ctx.resume();
            return ctx;
        }
        function ping(c, freq, t, vol, len) {
            const o = c.createOscillator(), g = c.createGain();
            o.frequency.setValueAtTime(freq, t);
            g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
            o.connect(g).connect(c.destination); o.start(t); o.stop(t + len + 0.05);
        }
        function playRealisticCoinSound(action) {
            const c = !muted && getCtx(); if (!c) return;
            const now = c.currentTime;
            if (action === 'toss') {
                const o = c.createOscillator(), g = c.createGain();
                o.frequency.setValueAtTime(300, now); o.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                g.gain.setValueAtTime(0.2, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                o.connect(g).connect(c.destination); o.start(now); o.stop(now + 0.15);
            } else if (action === 'tap') {      // [신규] 바운스 때 나는 작은 타격음
                ping(c, 1500, now, 0.03, 0.08); ping(c, 1050, now, 0.02, 0.1);
            } else {
                [800, 1100, 1500].forEach((f, i) => {
                    ping(c, f, now, 0.08, 0.2 + i * 0.05);
                    ping(c, f * 1.02, now + 0.14, 0.03, 0.12);   // [신규] 작은 잔향 바운스
                });
            }
        }
        const buzz = (p) => { if (!muted && navigator.vibrate) navigator.vibrate(p); };  // [신규] 햅틱

        // [개선] setInterval → requestAnimationFrame (프레임 동기화, 탭 비활성 시 자동 정지)
        function tick(t) {
            power += POWER_PER_MS * Math.min(t - last, 50) * direction; last = t;
            if (power >= 100) { power = 100; direction = -1; } else if (power <= 0) { power = 0; direction = 1; }
            gauge.style.width = power + '%';
            gCont.setAttribute('aria-valuenow', Math.round(power));
            raf = requestAnimationFrame(tick);
        }
        function startPress() {
            if (tossing || raf) return;
            getCtx();
            btn.classList.add('pressed');
            power = 0; direction = 1; gCont.style.opacity = '1'; last = performance.now();
            raf = requestAnimationFrame(tick);
        }
        function release() {
            if (!raf) return;
            cancelAnimationFrame(raf); raf = 0;
            btn.classList.remove('pressed'); gCont.style.opacity = '0';
            tossCoin(power);
        }

        // [개선] mouse/touch 이중 처리 → Pointer Events 통합 + 키보드 지원
        btn.addEventListener('pointerdown', (e) => { if (e.button > 0) return; btn.setPointerCapture(e.pointerId); startPress(); });
        btn.addEventListener('pointerup', release);
        btn.addEventListener('pointercancel', release);
        btn.addEventListener('contextmenu', (e) => e.preventDefault());
        btn.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); startPress(); } });
        btn.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); release(); } });
        btn.addEventListener('blur', release);

        // ===== 3D 동전 구성 =====
        coin.insertAdjacentHTML('afterbegin', Array.from({ length: 16 }, (_, i) => `<i class="rim ${i < 8 ? 'silver' : 'gold'}" style="--i:${i}"></i>`).join(''));

        const REST = 22, RAD = Math.PI / 180;   // REST: 정지 상태에서 동전이 카메라 쪽으로 기울어진 각도
        let restFlip = 0;                        // 직전 결과 면 (0=앞면, 180=뒷면)

        function pose(P) {
            coin.style.transform = `translate3d(${P.x}px, ${P.y}px, ${P.z}px) rotateZ(${P.roll}deg) rotateY(${P.yaw}deg) rotateX(${P.flip + REST}deg)`;
            coin.style.setProperty('--sx', (50 + 50 * Math.sin((P.flip + P.yaw) * RAD)) + '%');
            coin.style.setProperty('--lit', 0.2 + 0.8 * Math.pow(Math.abs(Math.cos(P.flip * RAD)) * Math.cos(P.yaw * RAD), 3));
            const k = Math.max(0, Math.min(1, -P.y / P.max));
            shadow.style.transform = `scale(${1 - 0.5 * k})`; shadow.style.opacity = 1 - 0.65 * k;
        }
        const rest = { x: 0, y: 0, z: 0, roll: 0, yaw: 0, flip: 0, max: 1 };
        pose(rest);

        // 착지 후 작아지는 튕김: 횟수(k)와 높이(y) 반환
        function hop(s) {
            let d = 0.2, h = 22, k = 0;
            while (s > d && d > 0.03) { s -= d; d *= 0.55; h *= 0.35; k++; }
            const v = s / d;
            return { k, y: s <= d ? -h * 4 * v * (1 - v) : 0 };
        }

        // [개선] CSS transition 2단계 → 프레임마다 물리 계산: 포물선 비행 + 등속 회전 + 축 흔들림 + 바운스 + 잔떨림
        function tossCoin(p) {
            tossing = true; btn.setAttribute('aria-disabled', 'true');
            result.style.opacity = '0'; result.textContent = '';
            coin.classList.add('blurring');
            playRealisticCoinSound('toss'); buzz(15);

            const isHeads = Math.random() < 0.5, rm = reduceMotion.matches;
            // 영상 분석 결과: 느리고 우아한 체공, 정점에서 오래 머묾, 축이 비틀리며 입체적으로 구르고, 올라갈수록 카메라 쪽으로 다가옴
            const H = rm ? 40 : 100 + p * 1.3;                       // 최고 높이(px)
            const T = rm ? 300 : 1700;                               // 체공 시간(ms): 기존과 동일 (상승 1.0초 + 낙하 0.7초)
            const end = (rm ? 0 : (4 + Math.floor(p / 15)) * 360) + (isHeads ? 0 : 180);
            const x0 = rm ? 0 : (Math.random() - 0.5) * 60;          // 가로 이동은 작게 (영상은 화면 중앙 유지)
            const A = rm ? 0 : 1;
            const ph = Math.random() * Math.PI * 2;                  // 매번 다른 흔들림 궤적
            const SETTLE = rm ? 200 : 400;                          // 착지 후 결과 표시까지 0.4초 (기존: 0.1 + 0.3초)
            const start = performance.now();
            let landed = false, bounces = 0;
            current = { isHeads, p };

            function frame(now) {
                const t = now - start;
                if (t < T) {
                    const u = t / T, a = rm ? 0.5 : 1000 / 1700;                     // 정점 시점: 기존과 동일(1.0초)
                    const up = 1 - Math.pow(u < a ? (a - u) / a : (u - a) / (1 - a), 2.4);   // 정점이 평평한 궤적(체공감)
                    const spin = u < a ? 0.5 * (u / a) : 0.5 + 0.5 * ((u - a) / (1 - a));    // 기존과 동일: 상승 중 절반, 낙하 중 나머지 절반 회전
                    const env = Math.sin(Math.PI * u);                               // 출발·착지 시 흔들림 0
                    pose({ x: x0 * env, y: -H * up, z: H * up * 0.6,
                           roll: A * 28 * env * Math.sin(Math.PI * 2.5 * u + ph),
                           yaw: A * 70 * env * Math.sin(Math.PI * 1.8 * u + ph * 0.7),
                           flip: restFlip + (end - restFlip) * spin, max: H });
                } else {
                    if (!landed) {
                        landed = true; playRealisticCoinSound('drop'); buzz(25);
                        setTimeout(() => coin.classList.remove('blurring'), 100);
                    }
                    const s = (t - T) / 1000;
                    if (t - T >= SETTLE) { pose({ ...rest, flip: end }); return finish(isHeads, p); }
                    const h = rm ? { k: 0, y: 0 } : hop(s);
                    if (h.k > bounces) { bounces = h.k; playRealisticCoinSound('tap'); buzz(8); }
                    const w = A ? 14 * Math.exp(-s * 8) * Math.sin(s * 30) : 0;   // 동전이 흔들리며 눕는 잔떨림
                    pose({ x: 0, y: h.y, z: 0, roll: 0, yaw: w * 0.4, flip: end + w, max: H });
                }
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }

        function finish(isHeads, p) {
            restFlip = isHeads ? 0 : 180;
            result.textContent = `POWER ${Math.round(p)}% : ${isHeads ? '태양' : '초승달'}`;
            result.style.opacity = '1';
            stats[isHeads ? 'heads' : 'tails']++; save(); render();
            btn.removeAttribute('aria-disabled'); tossing = false;
        }
    </script>
</body>
</html>
